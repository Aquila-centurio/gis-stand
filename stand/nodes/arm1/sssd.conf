[sssd]
domains = gis.local
services = nss, pam

[domain/gis.local]
id_provider = ad
auth_provider = ad
access_provider = ad
chpass_provider = ad
ad_domain = gis.local
krb5_realm = GIS.LOCAL
ad_server = dc.gis.local
# UID/GID вычисляются из SID (атрибуты RFC2307 пользователям не заполняли).
ldap_id_mapping = true
use_fully_qualified_names = false
fallback_homedir = /home/%u
default_shell = /bin/bash
cache_credentials = false
krb5_store_password_if_offline = false
# Групповые политики в учебном домене не настраивали: GPO не проверяем, только логируем.
ad_gpo_access_control = permissive
# Войти на АРМ могут только члены доменных групп Admin и Workgroup.
ad_access_filter = (|(memberOf=CN=Admin,CN=Users,DC=gis,DC=local)(memberOf=CN=Workgroup,CN=Users,DC=gis,DC=local))
