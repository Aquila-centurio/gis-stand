# AIDE на arm1: контроль целостности настроек безопасности АРМ (аналог КЦ Secret Net).
# База создаётся при старте контейнера (entrypoint), проверка: aide -c /etc/aide/aide-gis.conf --check
database_in=file:/var/lib/aide/gis/aide.db
database_out=file:/var/lib/aide/gis/aide.db.new
gzip_dbout=no
report_url=stdout

# права, владелец, группа, размер, время изменения, хеш SHA-256, POSIX ACL
GIS = p+u+g+s+m+sha256+acl

/etc/passwd$       GIS
/etc/group$        GIS
/etc/ssh/sshd_config$ GIS
/etc/krb5.conf$    GIS
/etc/pam.d         GIS
/etc/security      GIS
/etc/sssd          GIS
/usr/local/bin     GIS
