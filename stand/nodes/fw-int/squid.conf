# Squid на fw-int: единственный путь из intra в «интернет», только после авторизации на RADIUS.
http_port 192.168.200.1:3128
visible_hostname fw-int
# Docker даёт контейнеру nofile ~1e9, без этого лимита Squid падает на выделении таблицы дескрипторов.
max_filedescriptors 4096

# Basic-авторизация, логин и пароль проверяет FreeRADIUS (radius, 192.168.50.5).
# Файл radius.conf (server/secret/identifier) создаёт entrypoint из stand/secrets/stand.env.
auth_param basic program /usr/lib/squid/basic_radius_auth -f /etc/squid/radius.conf -t 5
auth_param basic children 3
auth_param basic realm GIS proxy: login RADIUS
auth_param basic credentialsttl 1 minute

acl intra src 192.168.200.0/24
acl radius_users proxy_auth REQUIRED

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny !intra
http_access allow intra radius_users
http_access deny all

# Кэш на диске не нужен; логи в /var/log/squid/access.log (кто, куда, код ответа, логин).
cache deny all
access_log daemon:/var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
pid_filename /run/squid.pid
coredump_dir /var/spool/squid
