listen=YES
listen_ipv6=NO

anonymous_enable=NO
local_enable=YES
write_enable=YES

chroot_local_user=YES
allow_writeable_chroot=YES
local_umask=022

pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110
pasv_address=192.168.100.11

xferlog_enable=YES
xferlog_std_format=NO
log_ftp_protocol=YES
vsftpd_log_file=/var/log/vsftpd/vsftpd.log
dual_log_enable=YES

# Внутри контейнера без лишних возможностей ядра seccomp-фильтр vsftpd падает
# (нет части syscall, которые он ожидает) — отключаем, это не влияет на правила
# доступа и МЭ, только на внутреннюю песочницу самого vsftpd.
seccomp_sandbox=NO

pam_service_name=vsftpd
userlist_enable=NO
