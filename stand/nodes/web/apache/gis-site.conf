# Учебный сайт «Интернет-сайт Счётной палаты РФ».
# Решение по HTTP/HTTPS: 80 отдаёт только редирект на 443, сам сайт только по HTTPS
# (самоподписанный сертификат, обычный TLS — ГОСТ-TLS в открытом стенде недоступен).

<VirtualHost *:80>
    ServerName 198.51.100.1
    Redirect permanent / https://198.51.100.1/
</VirtualHost>

<VirtualHost *:443>
    ServerName 198.51.100.1
    DocumentRoot /var/www/site

    SSLEngine on
    SSLCertificateFile /etc/ssl/gis/web.crt
    SSLCertificateKeyFile /etc/ssl/gis/web.key

    <Directory /var/www/site>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/gis-error.log
    CustomLog ${APACHE_LOG_DIR}/gis-access.log combined
</VirtualHost>
