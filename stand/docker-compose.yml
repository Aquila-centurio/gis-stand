name: gis

networks:
  ext:
    name: gis_ext
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam:
      config:
        - subnet: 198.51.100.0/24
          gateway: 198.51.100.254
  transit:
    name: gis_transit
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam:
      config:
        - subnet: 192.168.50.0/24
          gateway: 192.168.50.254
  dmz:
    name: gis_dmz
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam:
      config:
        - subnet: 192.168.100.0/24
          gateway: 192.168.100.254
  intra:
    name: gis_intra
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam:
      config:
        - subnet: 192.168.200.0/24
          gateway: 192.168.200.254

volumes:
  dc-lib:
  dc-etc:

services:
  fw-ext:
    build: ./nodes/fw-ext
    image: gis-fw-ext
    container_name: gis-fw-ext
    hostname: fw-ext
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: 1
    networks:
      ext:
        ipv4_address: 198.51.100.1
      transit:
        ipv4_address: 192.168.50.1

  gw-dmz:
    build: ./nodes/gw-dmz
    image: gis-gw-dmz
    container_name: gis-gw-dmz
    hostname: gw-dmz
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: 1
    volumes:
      - ./logs/gw-dmz:/var/log/suricata
    networks:
      transit:
        ipv4_address: 192.168.50.2
      dmz:
        ipv4_address: 192.168.100.1

  vpn:
    build: ./nodes/vpn
    image: gis-vpn
    container_name: gis-vpn
    hostname: vpn
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: 1
    volumes:
      - ./secrets/wg:/secrets/wg
    networks:
      transit:
        ipv4_address: 192.168.50.3

  fw-int:
    build: ./nodes/fw-int
    image: gis-fw-int
    container_name: gis-fw-int
    hostname: fw-int
    cap_add: [NET_ADMIN]
    env_file: ./secrets/stand.env
    sysctls:
      net.ipv4.ip_forward: 1
    networks:
      transit:
        ipv4_address: 192.168.50.4
      intra:
        ipv4_address: 192.168.200.1

  radius:
    build: ./nodes/radius
    image: gis-radius
    container_name: gis-radius
    hostname: radius
    cap_add: [NET_ADMIN]
    env_file: ./secrets/stand.env
    networks:
      transit:
        ipv4_address: 192.168.50.5

  web:
    build: ./nodes/web
    image: gis-web
    container_name: gis-web
    hostname: web
    cap_add: [NET_ADMIN]
    env_file: ./secrets/stand.env
    networks:
      dmz:
        ipv4_address: 192.168.100.10

  ftp:
    build: ./nodes/ftp
    image: gis-ftp
    container_name: gis-ftp
    hostname: ftp
    # vsftpd не умеет быть PID 1: SIGCHLD от чужого осиротевшего процесса роняет его с SIGSEGV
    # (код 139, results/02-dmz-services.md). PID 1 отдаём docker-init, он забирает сирот.
    init: true
    cap_add: [NET_ADMIN]
    env_file: ./secrets/stand.env
    networks:
      dmz:
        ipv4_address: 192.168.100.11

  db:
    build: ./nodes/db
    image: gis-db
    container_name: gis-db
    hostname: db
    cap_add: [NET_ADMIN]
    env_file: ./secrets/stand.env
    networks:
      intra:
        ipv4_address: 192.168.200.10

  dc:
    build: ./nodes/dc
    image: gis-dc
    container_name: gis-dc
    hostname: dc
    domainname: gis.local
    cap_add: [NET_ADMIN]
    env_file: ./secrets/stand.env
    volumes:
      - dc-lib:/var/lib/samba
      - dc-etc:/etc/samba
    networks:
      intra:
        ipv4_address: 192.168.200.20

  arm1:
    build: ./nodes/arm1
    image: gis-arm1
    container_name: gis-arm1
    hostname: arm1
    domainname: gis.local
    cap_add: [NET_ADMIN]
    env_file: ./secrets/stand.env
    depends_on: [dc]
    networks:
      intra:
        ipv4_address: 192.168.200.31

  client:
    build: ./nodes/client
    image: gis-client
    container_name: gis-client
    hostname: client
    cap_add: [NET_ADMIN]
    env_file: ./secrets/stand.env
    volumes:
      - ./secrets/wg:/secrets/wg
    networks:
      ext:
        ipv4_address: 198.51.100.10

  attacker:
    build: ./nodes/attacker
    image: gis-attacker
    container_name: gis-attacker
    hostname: attacker
    cap_add: [NET_ADMIN]
    networks:
      ext:
        ipv4_address: 198.51.100.66

  inet:
    build: ./nodes/inet
    image: gis-inet
    container_name: gis-inet
    hostname: inet
    cap_add: [NET_ADMIN]
    networks:
      ext:
        ipv4_address: 198.51.100.80
